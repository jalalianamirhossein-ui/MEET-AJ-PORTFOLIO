# Included in the http context. Requires Nginx >= 1.19.4.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format sni_proxy '$remote_addr [$time_local] "$request" '
                     'host=$host sni=$ssl_server_name status=$status '
                     'bytes=$body_bytes_sent rt=$request_time '
                     'upstream=$upstream_addr us=$upstream_status '
                     'uct=$upstream_connect_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SNI_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com jira.example.com
                grafana.example.com gitlab.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.example.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SNI_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # Return-only guard: do not route mismatched SNI/HTTP names.
    if ($ssl_server_name != $host) { return 421; }
    if ($host != app.example.com) { return 421; }

    client_max_body_size 100M;
    access_log /var/log/nginx/app.example.com.access.log sni_proxy;
    error_log  /var/log/nginx/app.example.com.error.log warn;

    location / {
        proxy_pass http://10.10.10.11:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

