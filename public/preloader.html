<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader Component Example</title>
    <link rel="stylesheet" href="preloader.css?v=devops-2" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      .language-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        background: #2563eb;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        border: none;
        font-size: 14px;
        font-weight: 500;
      }

      .main-content {
        padding: 50px;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .main-content h1 {
        color: #ef4e12;
        margin-bottom: 20px;
        font-size: 2.5rem;
      }

      .main-content p {
        font-size: 18px;
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto;
      }

      .rtl {
        direction: rtl;
        font-family: "Vazirmatn", "Tahoma", sans-serif;
      }

      .ltr {
        direction: ltr;
        font-family: "Inter", sans-serif;
      }

      @media (max-width: 768px) {
        .main-content {
          padding: 30px 20px;
        }

        .main-content h1 {
          font-size: 2rem;
        }

        .main-content p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Language Toggle Button -->
    <button class="language-toggle" onclick="toggleLanguage()">
      <span id="toggle-text">فارسی</span>
    </button>

    <!-- Meet AJ DevOps infinity preloader -->
    <!-- Continuous delivery loop: color travels along one unbroken infinity path. -->
<div id="preloader" class="preloader-overlay visible" role="status" aria-live="polite" aria-busy="true">
  <div id="preloader-container" class="preloader-container ltr">
    <svg class="devops-infinity" viewBox="0 0 320 160" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="devops-loop-gradient" x1="30" y1="30" x2="290" y2="130" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#426de0"><animate attributeName="stop-color" values="#426de0;#27b6c7;#9275df;#426de0" dur="6s" repeatCount="indefinite" /></stop>
          <stop offset=".5" stop-color="#27b6c7"><animate attributeName="stop-color" values="#27b6c7;#9275df;#426de0;#27b6c7" dur="6s" repeatCount="indefinite" /></stop>
          <stop offset="1" stop-color="#9275df"><animate attributeName="stop-color" values="#9275df;#426de0;#27b6c7;#9275df" dur="6s" repeatCount="indefinite" /></stop>
        </linearGradient>
        <path id="devops-loop-path" pathLength="100" d="M160 80 C125 30 105 28 80 28 C12 28 12 132 80 132 C105 132 125 130 160 80 C195 30 215 28 240 28 C308 28 308 132 240 132 C215 132 195 130 160 80Z" />
      </defs>
      <use href="#devops-loop-path" class="devops-loop-track" />
      <use href="#devops-loop-path" class="devops-loop-color" />
      <use href="#devops-loop-path" class="devops-loop-flow devops-loop-flow-blue" />
      <use href="#devops-loop-path" class="devops-loop-flow devops-loop-flow-teal" />
      <use href="#devops-loop-path" class="devops-loop-flow devops-loop-flow-violet" />
    </svg>
    <div class="preloader-wordmark"><strong>Meet AJ</strong><span>Infrastructure &amp; DevOps</span></div>
    <span id="loading-text" class="loading-text" data-en="Loading…" data-fa="در حال بارگذاری…">Loading…</span>
  </div>
</div>


    <!-- Main Content -->
    <div id="main-content" class="main-content ltr" style="display: none">
      <h1 id="welcome-text">Welcome!</h1>
      <p id="content-text">
        Your website content will be displayed here. The preloader component is
        working successfully.
      </p>
    </div>

    <script>
      let currentLanguage = "en";

      function toggleLanguage() {
        currentLanguage = currentLanguage === "en" ? "fa" : "en";
        updateLanguage();
      }

      function updateLanguage() {
        const preloaderContainer = document.getElementById(
          "preloader-container",
        );
        const mainContent = document.getElementById("main-content");
        const loadingText = document.getElementById("loading-text");
        const welcomeText = document.getElementById("welcome-text");
        const contentText = document.getElementById("content-text");
        const toggleText = document.getElementById("toggle-text");

        if (currentLanguage === "fa") {
          // RTL Layout
          preloaderContainer.className = "preloader-container rtl";
          mainContent.className = "main-content rtl";
          loadingText.textContent = "در حال بارگذاری…";
          welcomeText.textContent = "خوش آمدید!";
          contentText.textContent =
            "محتوای سایت شما اینجا نمایش داده می‌شود. کامپوننت preloader با موفقیت کار می‌کند.";
          toggleText.textContent = "English";
        } else {
          // LTR Layout
          preloaderContainer.className = "preloader-container ltr";
          mainContent.className = "main-content ltr";
          loadingText.textContent = "Loading…";
          welcomeText.textContent = "Welcome!";
          contentText.textContent =
            "Your website content will be displayed here. The preloader component is working successfully.";
          toggleText.textContent = "فارسی";
        }
      }

      // Simulate loading process
      if (!new URLSearchParams(location.search).has('preview')) setTimeout(() => {
        const preloader = document.getElementById("preloader");
        const mainContent = document.getElementById("main-content");

        preloader.classList.remove("visible");
        preloader.classList.add("hidden");

        setTimeout(() => {
          preloader.style.display = "none";
          mainContent.style.display = "flex";
        }, 300);
      }, 3000);

      // Initialize
      updateLanguage();
    </script>
  </body>
</html>
