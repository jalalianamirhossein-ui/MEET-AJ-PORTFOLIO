<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FortiGate SD-WAN</title><desc id="desc">Load balancing + performance SLA + automatic failover</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#142c48"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#45d3cc"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="66" font-size="18" fill="#45d3cc" text-anchor="start">NETWORK ENGINEERING / FORTIOS 7.4 &amp; 7.6</text><text x="70" y="132" font-size="46" fill="#e7eef8" text-anchor="start">FortiGate SD-WAN</text><text x="70" y="178" font-size="23" fill="#b7c9dd" text-anchor="start">Load balancing + performance SLA + automatic failover</text><rect x="70" y="255" width="415" height="130" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="94" y="295" font-size="25" fill="#45d3cc" text-anchor="start">WAN1 / ISP-1</text><text x="94" y="330" font-size="19" fill="#b7c9dd" text-anchor="start">200 Mbps • primary capacity</text><rect x="1115" y="255" width="415" height="130" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="1139" y="295" font-size="25" fill="#45d3cc" text-anchor="start">WAN2 / ISP-2</text><text x="1139" y="330" font-size="19" fill="#b7c9dd" text-anchor="start">100 Mbps • additional capacity</text><path d="M485 320 L615 430" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1115 320 L985 430" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="550" y="420" width="500" height="180" rx="18" fill="#203956" stroke="#45d3cc" stroke-width="2"/><text x="800" y="478" font-size="40" fill="#ffffff" text-anchor="middle">FortiGate</text><text x="800" y="524" font-size="26" fill="#45d3cc" text-anchor="middle">SD-WAN policy engine</text><text x="800" y="563" font-size="23" fill="#b7c9dd" text-anchor="middle">Source / destination IP hash</text><path d="M800 600 L800 676" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="580" y="680" width="440" height="108" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="604" y="720" font-size="25" fill="#45d3cc" text-anchor="start">LAN / internal</text><text x="604" y="755" font-size="19" fill="#b7c9dd" text-anchor="start">10.10.10.0/24</text><rect x="70" y="460" width="380" height="165" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="94" y="500" font-size="25" fill="#45d3cc" text-anchor="start">Performance SLA</text><text x="94" y="535" font-size="19" fill="#b7c9dd" text-anchor="start">Latency • jitter • packet loss</text><text x="94" y="580" font-size="20" fill="#b7c9dd" text-anchor="start">Measured per WAN path</text><rect x="1150" y="460" width="380" height="165" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="1174" y="500" font-size="25" fill="#45d3cc" text-anchor="start">Session-aware routing</text><text x="1174" y="535" font-size="19" fill="#b7c9dd" text-anchor="start">New sessions use eligible paths</text><text x="1174" y="580" font-size="20" fill="#ffca7a" text-anchor="start">Existing flows may reconnect</text><text x="70" y="864" font-size="17" fill="#9bb1cb" text-anchor="start">Technical illustration • outbound internet • independent ISP paths</text></g></svg>