<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">SD-WAN + Performance SLA architecture</title><desc id="desc">Health and quality inform path selection; firewall policy still controls access</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#142c48"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#45d3cc"/></marker></defs><rect width="1600" height="940" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="66" font-size="18" fill="#45d3cc" text-anchor="start">NETWORK ENGINEERING / FORTIOS 7.4 &amp; 7.6</text><text x="70" y="132" font-size="46" fill="#e7eef8" text-anchor="start">SD-WAN + Performance SLA architecture</text><text x="70" y="178" font-size="23" fill="#b7c9dd" text-anchor="start">Health and quality inform path selection; firewall policy still controls access</text><rect x="70" y="255" width="430" height="132" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="94" y="295" font-size="25" fill="#45d3cc" text-anchor="start">Independent ISP members</text><text x="94" y="330" font-size="19" fill="#b7c9dd" text-anchor="start">WAN1 / WAN2</text><rect x="585" y="255" width="430" height="132" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="609" y="295" font-size="25" fill="#45d3cc" text-anchor="start">Internet-Probe</text><text x="609" y="330" font-size="19" fill="#b7c9dd" text-anchor="start">1.1.1.1 then 8.8.8.8</text><rect x="1100" y="255" width="430" height="132" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="1124" y="295" font-size="25" fill="#45d3cc" text-anchor="start">Example SLA target</text><text x="1124" y="330" font-size="19" fill="#b7c9dd" text-anchor="start">150 ms / 30 ms / 5% loss</text><path d="M500 320 L582 320" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1015 320 L1095 320" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="800" y="435" font-size="24" fill="#ffca7a" text-anchor="middle">Two servers are failover targets, not simultaneous voting.</text><path d="M800 455 L800 508" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="510" width="870" height="108" rx="18" fill="#203956" stroke="#45d3cc" stroke-width="2"/><text x="800" y="554" font-size="30" fill="#ffffff" text-anchor="middle">SD-WAN rules / eligible path selection</text><text x="800" y="592" font-size="23" fill="#b7c9dd" text-anchor="middle">Alive/dead and SLA pass/fail are separate states</text><path d="M560 618 L325 680" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1040 618 L1275 680" stroke="#45d3cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="90" y="685" width="470" height="114" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="114" y="725" font-size="25" fill="#45d3cc" text-anchor="start">Critical applications</text><text x="114" y="760" font-size="19" fill="#b7c9dd" text-anchor="start">Service-specific quality / fallback</text><rect x="1040" y="685" width="470" height="114" rx="18" fill="#14263d" stroke="#38506b" stroke-width="2"/><text x="1064" y="725" font-size="25" fill="#45d3cc" text-anchor="start">General internet</text><text x="1064" y="760" font-size="19" fill="#b7c9dd" text-anchor="start">Source-destination hash + SLA</text><text x="800" y="842" font-size="22" fill="#ffca7a" text-anchor="middle">If both WANs are alive but fail SLA, fallback may still use them.</text><text x="70" y="904" font-size="17" fill="#9bb1cb" text-anchor="start">Technical illustration • outbound internet • independent ISP paths</text></g></svg>