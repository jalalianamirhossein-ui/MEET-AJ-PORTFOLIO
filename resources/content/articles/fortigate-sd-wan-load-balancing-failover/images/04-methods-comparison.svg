<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">Load balancing methods comparison</title><desc id="desc">Persistence is conditional on a stable eligible path set; no single-session WAN bonding</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#142c48"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#45d3cc"/></marker></defs><rect width="1600" height="930" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="66" font-size="18" fill="#45d3cc" text-anchor="start">NETWORK ENGINEERING / FORTIOS 7.4 &amp; 7.6</text><text x="70" y="132" font-size="46" fill="#e7eef8" text-anchor="start">Load balancing methods comparison</text><text x="70" y="178" font-size="23" fill="#b7c9dd" text-anchor="start">Persistence is conditional on a stable eligible path set; no single-session WAN bonding</text><rect x="70" y="235" width="1460" height="84" rx="18" fill="#203956" stroke="#38506b" stroke-width="2"/><text x="96" y="285" font-size="23" fill="#45d3cc" text-anchor="start">METHOD</text><text x="630" y="285" font-size="23" fill="#45d3cc" text-anchor="start">PATH SELECTION</text><text x="1120" y="285" font-size="23" fill="#45d3cc" text-anchor="start">PERSISTENCE SCOPE</text><rect x="70" y="333" width="1460" height="66" rx="10" fill="#102137" stroke="#29425d" stroke-width="2"/><text x="96" y="375" font-size="25" fill="#e7eef8" text-anchor="start">Source IP</text><text x="630" y="375" font-size="23" fill="#b7c9dd" text-anchor="start">Client IP hash</text><text x="1120" y="375" font-size="22" fill="#b7c9dd" text-anchor="start">Across one source IP</text><rect x="70" y="409" width="1460" height="66" rx="10" fill="#13273e" stroke="#29425d" stroke-width="2"/><text x="96" y="451" font-size="25" fill="#e7eef8" text-anchor="start">Source-destination IP</text><text x="630" y="451" font-size="23" fill="#b7c9dd" text-anchor="start">Source + destination hash</text><text x="1120" y="451" font-size="22" fill="#b7c9dd" text-anchor="start">Across the same IP pair</text><rect x="70" y="485" width="1460" height="66" rx="10" fill="#102137" stroke="#29425d" stroke-width="2"/><text x="96" y="527" font-size="25" fill="#e7eef8" text-anchor="start">Sessions / weight</text><text x="630" y="527" font-size="23" fill="#b7c9dd" text-anchor="start">Session share / ratio</text><text x="1120" y="527" font-size="22" fill="#b7c9dd" text-anchor="start">Within each session</text><rect x="70" y="561" width="1460" height="66" rx="10" fill="#13273e" stroke="#29425d" stroke-width="2"/><text x="96" y="603" font-size="25" fill="#e7eef8" text-anchor="start">Volume</text><text x="630" y="603" font-size="23" fill="#b7c9dd" text-anchor="start">Measured traffic volume</text><text x="1120" y="603" font-size="22" fill="#b7c9dd" text-anchor="start">Within each session</text><rect x="70" y="637" width="1460" height="66" rx="10" fill="#102137" stroke="#29425d" stroke-width="2"/><text x="96" y="679" font-size="25" fill="#e7eef8" text-anchor="start">Spillover</text><text x="630" y="679" font-size="23" fill="#b7c9dd" text-anchor="start">Bandwidth threshold</text><text x="1120" y="679" font-size="22" fill="#b7c9dd" text-anchor="start">Within each session</text><rect x="70" y="713" width="1460" height="66" rx="10" fill="#13273e" stroke="#29425d" stroke-width="2"/><text x="96" y="755" font-size="25" fill="#e7eef8" text-anchor="start">Best quality / SLA</text><text x="630" y="755" font-size="23" fill="#b7c9dd" text-anchor="start">Measured quality / SLA</text><text x="1120" y="755" font-size="22" fill="#b7c9dd" text-anchor="start">Depends on rule / hash</text><text x="70" y="843" font-size="23" fill="#ffca7a" text-anchor="start">Weighted implicit rules do not make an explicit source-destination hash rule weighted.</text><text x="70" y="894" font-size="17" fill="#9bb1cb" text-anchor="start">Technical illustration • outbound internet • independent ISP paths</text></g></svg>