name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - name: Check PHP syntax
        run: find app bootstrap config database routes scripts tests -name '*.php' -not -path 'bootstrap/cache/*' -print0 | xargs -0 -n1 php -l
      - run: php artisan site:publish-assets --views
      - run: php artisan filament:assets
      - run: php artisan route:list
      - run: php artisan view:cache
      - run: php artisan test
      - run: node --test tests/Frontend/*.test.cjs
      - run: node scripts/check-images.cjs
      - run: node scripts/check-documentation.cjs
      - run: node scripts/check-repository-security.cjs
      - name: Check tracked file whitespace
        run: git diff --check
